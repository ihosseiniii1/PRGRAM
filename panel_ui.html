<html lang="en"><head>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='32' fill='%230d0d0d'/%3E%3Ccircle cx='32' cy='32' r='15' fill='none' stroke='%23ffffff' stroke-width='5'/%3E%3Ccircle cx='32' cy='32' r='5' fill='%23ffffff'/%3E%3C/svg%3E">
<title>PR GRAM</title>
<style>
/* [patch-ui:mono-v2] */
:root{--bg:#ffffff;--bg2:#f7f7f8;--card:#ffffff;--card2:#f0f0f1;--line:#ececec;--line2:#dadadd;--txt:#0d0d0d;--mut:#6e6e80;--faint:#a3a3ad;
 --acc:#0d0d0d;--acc-rgb:13,13,13;--acct:#0d0d0d;--on-acc:#ffffff;--chart:#0d0d0d;
 --ok:#0e7a4b;--warn:#a15c00;--bad:#c0392b;--vio:#8b8b96;--cy:#6e6e80;
 --r:16px;--r2:12px;--r3:8px;--pop:0 18px 50px rgba(0,0,0,.16);color-scheme:light}
:root[data-theme=dark]{--bg:#171717;--bg2:#1f1f1f;--card:#1f1f1f;--card2:#2a2a2a;--line:#2b2b2b;--line2:#3b3b3b;--txt:#ececec;--mut:#a0a0a8;--faint:#6b6b73;
 --acc:#ececec;--acc-rgb:236,236,236;--acct:#ececec;--on-acc:#111111;--chart:#ececec;
 --ok:#4ade80;--warn:#f5b942;--bad:#f87171;--vio:#8b8b96;--cy:#a0a0a8;--pop:0 18px 50px rgba(0,0,0,.65);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--txt);font:14px/1.6 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI Variable Text","Segoe UI",Inter,Vazirmatn,Roboto,"Helvetica Neue",Tahoma,system-ui,sans-serif;
 font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--txt);outline-offset:2px}
::selection{background:rgba(var(--acc-rgb),.16)}
::-webkit-scrollbar{width:10px;height:10px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:99px;border:3px solid transparent;background-clip:content-box}
.i{width:1.15em;height:1.15em;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.2em;flex:none}
#pbar{position:fixed;top:0;inset-inline-start:0;height:2px;width:0;background:var(--txt);z-index:200;opacity:0;pointer-events:none}
#pbar.on{opacity:1;width:82%;transition:width 9s cubic-bezier(.1,.8,.2,1)}
#pbar.on.fin{width:100%;transition:width .18s}
/* ---------- top bar ---------- */
#top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.tb{max-width:1040px;margin:0 auto;height:56px;display:flex;align-items:center;gap:18px;padding:0 24px}
.wm{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;text-decoration:none;letter-spacing:-.01em;white-space:nowrap}
.wm small{color:var(--faint);font-weight:500;font-size:11.5px}
.lg{width:26px;height:26px;border-radius:50%;background:var(--txt);color:var(--bg);display:grid;place-items:center;font-size:15px;flex:none}
#nav{display:flex;gap:2px}
#nav a{padding:6px 13px;border-radius:99px;color:var(--mut);font-weight:500;text-decoration:none;white-space:nowrap;transition:background .12s,color .12s}
#nav a:hover{background:var(--card2);color:var(--txt)}#nav a.on{background:var(--card2);color:var(--txt)}
#tbr{display:flex;gap:2px;align-items:center}
.sp{flex:1}
/* ---------- page head ---------- */
#phead{max-width:1040px;margin:0 auto;padding:40px 24px 0}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
.ph h1{margin:0;font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1.15}
.crumb{color:var(--mut);font-size:13px;margin-bottom:8px}.crumb a{color:inherit;text-decoration:none}.crumb a:hover{color:var(--txt);text-decoration:underline}
.ph-a{display:flex;gap:8px;align-items:center;margin-inline-start:auto;flex-wrap:wrap}
.subtabs{display:flex;gap:26px;margin-top:26px;border-bottom:1px solid var(--line);overflow-x:auto}
.subtabs a{padding:10px 0;color:var(--mut);text-decoration:none;font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;transition:color .12s}
.subtabs a:hover{color:var(--txt)}.subtabs a.on{color:var(--txt);border-bottom-color:var(--txt)}
#view{max-width:1040px;margin:0 auto;padding:36px 24px 120px}
#view.enter>*{animation:rise .22s ease-out both}
@keyframes rise{from{opacity:0;transform:translateY(5px)}}
/* ---------- atoms ---------- */
.ibtn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:50%;border:0;background:transparent;cursor:pointer;color:var(--mut);transition:background .12s,color .12s}
.ibtn:hover{color:var(--txt);background:var(--card2)}
.btn{display:inline-flex;gap:7px;align-items:center;justify-content:center;background:transparent;border:1px solid var(--line2);border-radius:99px;height:36px;padding:0 16px;cursor:pointer;font-weight:500;white-space:nowrap;transition:background .12s,border-color .12s,opacity .12s}
.btn:hover{background:var(--card2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.pri,.btn.ok{background:var(--txt);border-color:var(--txt);color:var(--bg)}
.btn.pri:hover,.btn.ok:hover{background:var(--txt);opacity:.85}
.btn.bad{color:var(--bad)}.btn.bad:hover{background:color-mix(in srgb,var(--bad) 9%,transparent);border-color:var(--bad)}
.btn.ghost{border-color:transparent;color:var(--mut)}.btn.ghost:hover{background:var(--card2);color:var(--txt)}
.btn.sm{height:30px;padding:0 13px;font-size:12.5px}
.btn.busy{pointer-events:none;opacity:.6}
.btn.busy:before{content:"";width:12px;height:12px;border-radius:50%;border:2px solid currentColor;border-top-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row.end{justify-content:flex-end}.row.nw{flex-wrap:nowrap}
.inp,select{background:var(--bg);border:1px solid var(--line2);border-radius:var(--r2);height:36px;padding:0 13px;min-width:0}
.inp:focus,select:focus{border-color:var(--txt);outline:none;box-shadow:0 0 0 3px rgba(var(--acc-rgb),.08)}
.chip{display:inline-flex;gap:8px;align-items:center;background:var(--bg2);border-radius:99px;padding:5px 13px;font-size:12.5px;color:var(--mut);white-space:nowrap}
.chip.bad{color:var(--bad)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block;flex:none}
.dot.running,.dot.slowed{background:var(--ok)}.dot.slowed,.dot.wait{background:var(--warn)}.dot.paused{background:var(--bad)}
.dot.rest,.dot.sleep,.dot.views{background:var(--vio)}.dot.offline{background:var(--line2)}
.tag{display:inline-flex;gap:4px;align-items:center;font-size:11.5px;padding:1px 9px;border-radius:99px;background:var(--bg2);color:var(--mut);margin-inline-end:4px}
.tag.ok{color:var(--ok)}.tag.warn{color:var(--warn)}.tag.bad{color:var(--bad)}.tag.vio{color:var(--txt)}
.banner{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r2);padding:13px 16px;margin-bottom:12px;background:var(--bg2)}
.banner .i{margin-top:3px;flex:none;color:var(--mut)}
.banner.warn .i{color:var(--warn)}.banner.bad .i{color:var(--bad)}.banner.info .i{color:var(--txt)}
.empty{color:var(--mut);text-align:center;padding:36px 10px}
.u{color:var(--faint);font-size:.5em;font-weight:500;letter-spacing:0;margin-inline-start:4px}
/* ---------- sections (replace cards) ---------- */
.sec,.card{padding:30px 0;border-top:1px solid var(--line);margin:0;background:none;border-radius:0;box-shadow:none}
.sec:first-child,.card:first-child{border-top:0;padding-top:0}
.sec-h,.card h3{display:flex;align-items:baseline;gap:12px;margin:0 0 20px;font-size:15px;font-weight:600;letter-spacing:-.01em}
.sec-h h2{margin:0;font-size:15px;font-weight:600;letter-spacing:-.01em}
.sec-h small,.card h3 small{margin-inline-start:auto;color:var(--mut);font-weight:400;font-size:12.5px}
.card h3 .i{color:var(--mut);align-self:center}
#ac-access .card{border-top:1px solid var(--line);padding-top:30px}
.cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 64px}
.cols>.sec:first-child{border-top:1px solid var(--line);padding-top:30px}
.grid{display:grid;gap:0 64px}.g2{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.status{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:22px 26px;background:var(--bg2);border-radius:20px;margin-bottom:36px}
.status>.dot{width:12px;height:12px;box-shadow:0 0 0 5px color-mix(in srgb,currentColor 0%,transparent)}
.status h2{margin:0;font-size:19px;font-weight:600;letter-spacing:-.02em}.status p{margin:0;color:var(--mut)}
.status .btns{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.kpis{display:grid;gap:30px 36px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:34px}
.tile .ti-h{color:var(--mut);font-size:13px}
.tile b{display:block;font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1.2;margin-top:4px}
.tile small{color:var(--mut);font-size:12.5px}
.nums{margin-bottom:26px}.nums .tile b{font-size:42px;letter-spacing:-.04em}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));margin-bottom:40px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.facts>div{padding:15px 0;display:flex;flex-direction:column;gap:2px}.facts span{color:var(--mut);font-size:12.5px}.facts b{font-size:17px;font-weight:600;letter-spacing:-.01em}
.lbl{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;gap:10px}.lbl b{color:var(--txt);font-weight:600}
.bar{height:4px;background:var(--card2);border-radius:99px;overflow:hidden;margin:8px 0 18px}
.bar i{display:block;height:100%;background:var(--txt);border-radius:99px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.bar.warn i{background:var(--warn)}.bar.bad i{background:var(--bad)}.bar.ok i{background:var(--txt)}
.safe .score{font-size:56px;font-weight:600;letter-spacing:-.05em;line-height:1}.safe .score small{font-size:15px;color:var(--faint);letter-spacing:0;font-weight:500;margin-inline-start:4px}
.safe .bar{margin:14px 0 18px}
.pen{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mut);padding:8px 0;border-top:1px solid var(--line)}.pen b{color:var(--warn);font-weight:600}
.tl .ev{display:flex;gap:16px;padding:10px 0;border-top:1px solid var(--line);font-size:13px}.tl .ev:first-child{border-top:0;padding-top:0}
.tl .ev time{color:var(--faint);font:12px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;flex:none;padding-top:1px}
.chart{width:100%;height:160px;display:block}.chart .gl{stroke:var(--line);stroke-width:1;vector-effect:non-scaling-stroke}
.chart rect{fill:var(--chart);opacity:.9;transition:opacity .12s}.chart rect:hover{opacity:.5}.chart rect[fill="var(--bad)"]{fill:var(--bad)}
.axis{display:flex;justify-content:space-between;color:var(--faint);font-size:11.5px;margin-top:8px}
.seg,.tabs{display:inline-flex;flex-wrap:wrap;gap:2px;background:var(--bg2);padding:3px;border-radius:99px}
.seg button,.tabs button{border:0;background:transparent;height:30px;padding:0 15px;border-radius:99px;cursor:pointer;color:var(--mut);font-weight:500}
.seg button:hover,.tabs button:hover{color:var(--txt)}
.seg button.on,.tabs button.on{background:var(--bg);color:var(--txt);box-shadow:0 0 0 1px var(--line2)}
.sk{background:linear-gradient(90deg,var(--bg2) 25%,var(--card2) 50%,var(--bg2) 75%);background-size:220% 100%;animation:sh 1.4s linear infinite;border-radius:8px;min-height:14px}
@keyframes sh{to{background-position:-220% 0}}
.skc{padding:30px 0;border-top:1px solid var(--line)}.skc:first-child{border-top:0}.skc .sk{margin-bottom:10px}
/* ---------- settings ---------- */
#st-root{display:grid;grid-template-columns:210px minmax(0,1fr);gap:56px;align-items:start}
.sn{position:sticky;top:80px;display:flex;flex-direction:column;gap:2px}
.sn button{border:0;background:transparent;text-align:start;padding:9px 12px;border-radius:var(--r2);color:var(--mut);font-weight:500;display:flex;gap:11px;align-items:center;cursor:pointer;transition:background .12s,color .12s}
.sn button:hover{background:var(--bg2);color:var(--txt)}.sn button.on{background:var(--card2);color:var(--txt)}
.pane{min-width:0}.pane .search{max-width:none;margin-bottom:22px}
[data-sec]{display:none}[data-sec].on,#st-root.all [data-sec]{display:block}
#st-root.all [data-sec]+[data-sec]{margin-top:40px}
.st-h{margin:0 0 6px;font-size:22px;font-weight:600;letter-spacing:-.02em}
.st-sub{color:var(--mut);margin:0 0 10px}
.fld{display:flex;justify-content:space-between;gap:28px;align-items:center;padding:20px 0;border-top:1px solid var(--line);transition:opacity .2s}
.st-h+.fld{border-top:0}.fld.off{opacity:.38}.fld.hit{background:var(--bg2);border-radius:var(--r3);padding-inline:12px}
.fld.dirty .fl b:after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--txt);margin-inline-start:8px;vertical-align:middle}
.fl b{display:block;font-weight:500;font-size:14.5px}.fl small{color:var(--mut);display:block;max-width:56ch;margin-top:2px}
.fc{flex:none;min-width:150px;display:flex;justify-content:flex-end}
.rng{display:flex;gap:12px;align-items:center}
.rng input[type=range]{width:170px;-webkit-appearance:none;appearance:none;height:4px;border-radius:99px;background:var(--line2);cursor:pointer;accent-color:var(--txt)}
.rng input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--txt);border:3px solid var(--bg);box-shadow:0 0 0 1px var(--txt)}
.rng input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--txt);border:3px solid var(--bg)}
.rng .num{width:78px;text-align:center;font-weight:600}.rng .u{font-size:12.5px;color:var(--mut);min-width:22px;margin:0}
.sw{position:relative;width:42px;height:26px;display:inline-block}.sw input{opacity:0;width:0;height:0}
.sw i{position:absolute;inset:0;background:var(--line2);border-radius:99px;transition:.18s;cursor:pointer}
.sw i:before{content:"";position:absolute;width:20px;height:20px;top:3px;inset-inline-start:3px;background:var(--bg);border-radius:50%;transition:.18s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.sw input:checked+i{background:var(--txt)}.sw input:checked+i:before{transform:translateX(16px)}[dir=rtl] .sw input:checked+i:before{transform:translateX(-16px)}
.sw input:focus-visible+i{outline:2px solid var(--txt);outline-offset:2px}
.pres{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));margin-top:14px}
.pcard{border:1px solid var(--line);background:transparent;border-radius:var(--r);padding:18px;cursor:pointer;text-align:start;transition:border-color .12s,background .12s}
.pcard:hover{border-color:var(--txt);background:var(--bg2)}.pcard b{display:flex;gap:8px;align-items:center;font-weight:600;margin-bottom:4px}.pcard small{color:var(--mut)}
.pcard:disabled{opacity:.4;cursor:not-allowed}
.savebar{position:fixed;inset-inline:0;margin-inline:auto;width:fit-content;max-width:94vw;bottom:26px;background:var(--txt);color:var(--bg);border-radius:99px;padding:8px 8px 8px 22px;display:flex;gap:12px;align-items:center;box-shadow:var(--pop);z-index:60;animation:rise .2s}
.savebar .btn{border-color:color-mix(in srgb,var(--bg) 35%,transparent);color:var(--bg)}.savebar .btn:hover{background:color-mix(in srgb,var(--bg) 14%,transparent)}
.savebar .btn.pri{background:var(--bg);border-color:var(--bg);color:var(--txt)}
.savebar kbd{border-color:color-mix(in srgb,var(--txt) 30%,transparent);color:inherit;opacity:.6}
/* ---------- tables / toolbars ---------- */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search{position:relative;flex:1;min-width:180px;max-width:380px}.search .i{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search .inp{width:100%;padding-inline-start:38px;border-radius:99px;background:var(--bg2);border-color:transparent}
.search .inp:focus{background:var(--bg);border-color:var(--txt)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fch{border:0;background:var(--bg2);color:var(--mut);height:30px;padding:0 14px;border-radius:99px;cursor:pointer;font-size:12.5px;font-weight:500}
.fch:hover{color:var(--txt)}.fch.on{background:var(--txt);color:var(--bg)}
.scroll{max-height:600px;overflow:auto;border:1px solid var(--line);border-radius:var(--r)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{text-align:start;padding:12px 16px;border-bottom:1px solid var(--line)}
tbody tr:last-child td{border-bottom:0}
th{color:var(--mut);font-weight:500;font-size:12.5px;position:sticky;top:0;background:var(--bg2);white-space:nowrap;z-index:1}
th[data-act]{cursor:pointer}th[data-act]:hover{color:var(--txt)}
tbody tr:hover{background:var(--bg2)}
input[type=checkbox]{accent-color:var(--txt);width:15px;height:15px}
#lg-box{background:var(--bg2);border-radius:var(--r);padding:16px;height:64vh;overflow:auto;font:12.5px/1.75 ui-monospace,SFMono-Regular,"Cascadia Mono",Menlo,Consolas,monospace}
#lg-box.nw .l{white-space:pre;}#lg-box .l{white-space:pre-wrap;word-break:break-word;color:var(--mut)}
#lg-box .l.WARNING{color:var(--warn)}#lg-box .l.ERROR{color:var(--bad)}#lg-box mark{background:rgba(var(--acc-rgb),.18);color:inherit;border-radius:3px}
/* ---------- layers ---------- */
#toasts{position:fixed;inset-block-end:26px;inset-inline:0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:300;pointer-events:none}
.toast{display:flex;gap:10px;align-items:center;background:var(--txt);color:var(--bg);border-radius:99px;padding:10px 20px;box-shadow:var(--pop);max-width:min(440px,92vw);animation:rise .18s;pointer-events:auto}
.toast .i{color:inherit}.toast.err{background:var(--bad);color:#fff}.toast.out{opacity:0;transition:.25s}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(3px);display:grid;place-items:center;z-index:150;padding:16px;animation:fade .12s}
.modal.top{align-items:start;padding-top:12vh}
@keyframes fade{from{opacity:0}}
.mbox{background:var(--card);border-radius:24px;padding:28px;max-width:440px;width:100%;box-shadow:var(--pop)}
.mbox h3{margin:0 0 8px;font-size:18px;font-weight:600;letter-spacing:-.02em}
.pal{background:var(--card);border-radius:20px;width:min(600px,100%);box-shadow:var(--pop);overflow:hidden}
.pin{display:flex;gap:10px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);color:var(--mut)}
.pin input{flex:1;background:transparent;border:0;outline:0;font-size:15px;color:var(--txt)}
.plist{max-height:50vh;overflow:auto;padding:8px}
.pi{display:flex;gap:12px;align-items:center;padding:10px 12px;border-radius:var(--r2);cursor:pointer}
.pi.on{background:var(--card2)}.pi .i{color:var(--mut)}
.phint{padding:10px 20px;color:var(--faint);font-size:12px;border-top:1px solid var(--line)}
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lbox{width:min(360px,100%);display:flex;flex-direction:column;gap:12px;text-align:center}
.lbox .lg{width:44px;height:44px;font-size:26px;margin:0 auto 10px}
.lbox h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.03em}
.lbox p{margin:0 0 14px;color:var(--mut)}
.lbox .inp{height:48px;border-radius:99px;padding:0 20px;text-align:center}.lbox .btn.pri{height:48px;font-size:15px}
.lfoot{margin-top:18px}
kbd{font:11px ui-monospace,Menlo,monospace;border:1px solid var(--line2);border-radius:5px;padding:0 6px;color:var(--mut)}
.only-m,#tabbar{display:none}
@media(max-width:860px){

const KEEP_ATTR=/^(data-label|data-sig|aria-label|aria-current)$/;
function syncAttrs(x,y){
 for(const at of Array.from(x.attributes)){if(!y.hasAttribute(at.name)&&!KEEP_ATTR.test(at.name))x.removeAttribute(at.name)}
 for(const at of Array.from(y.attributes)){if(x.getAttribute(at.name)!==at.value)x.setAttribute(at.name,at.value)}}
function morph(a,b){
 const bc=b.childNodes;
 for(let i=0;i<bc.length;i++){
  const x=a.childNodes[i],y=bc[i];
  if(!x){a.appendChild(y.cloneNode(true));continue}
  if(x.nodeType!==y.nodeType||x.nodeName!==y.nodeName){a.replaceChild(y.cloneNode(true),x);continue}
  if(x.nodeType!==1){if(x.nodeValue!==y.nodeValue)x.nodeValue=y.nodeValue;continue}
  if(/^(INPUT|SELECT|TEXTAREA)$/.test(x.nodeName)){
   if(x===document.activeElement)continue;
   if(!x.isEqualNode(y)){if(x.type==='range'&&x.getAttribute('style')){const c=y.cloneNode(true);c.setAttribute('style',x.getAttribute('style'));if(x.isEqualNode(c))continue}a.replaceChild(y.cloneNode(true),x)}
   continue}
  syncAttrs(x,y);morph(x,y)}
 while(a.childNodes.length>bc.length)a.removeChild(a.lastChild)}

function bindPasswordControls(root){$$('[data-password-toggle]',root).forEach(btn=>{btn.onclick=()=>{const input=$('#'+btn.dataset.passwordToggle,root);if(!input)return;input.type=input.type==='password'?'text':'password';btn.setAttribute('aria-label',input.type==='password'?tr('Show password','نمایش رمز'):tr('Hide password','پنهان‌کردن رمز'))}});const input=$('#newPassword',root),fill=$('#passwordStrengthFill',root),label=$('#passwordStrengthLabel',root),confirm=$('#confirmPassword',root),match=$('#passwordMatch',root);const update=()=>{if(input&&fill&&label){const v=input.value||'';let score=0;if(v.length>=10)score++;if(v.length>=14)score++;if(/[a-z]/.test(v)&&/[A-Z]/.test(v))score++;if(/[0-9]/.test(v))score++;if(/[^A-Za-z0-9]/.test(v))score++;const pct=v.length?Math.max(14,score*20):0;fill.style.width=pct+'%';fill.dataset.level=score<=1?'weak':score<=2?'fair':score<=3?'good':'strong';label.textContent=!v?'':score<=1?tr('Weak','ضعیف'):score<=2?tr('Fair','متوسط'):score<=3?tr('Good','خوب'):tr('Strong','قوی')}if(confirm&&match){match.textContent=!confirm.value?'':confirm.value===(input&&input.value||'')?tr('Passwords match','رمزها یکسان‌اند'):tr('Passwords do not match','رمزها یکسان نیستند');match.dataset.match=confirm.value===(input&&input.value||'')?'yes':'no'}};if(input)input.addEventListener('input',update);if(confirm)confirm.addEventListener('input',update);update()}

let POLL=0;
async function boot(){applyLook();const u=new URL(location.href);if(u.searchParams.has('t')){u.searchParams.delete('t');history.replaceState(null,'',u.pathname+(u.search||'')+u.hash)}ls.del('pg_tok');S.tok='';$('#root').innerHTML='<div class="login"><div class="login-loading"><span class="lg">'+ic('logo')+'</span><div class="sk" style="height:18px;width:55%"></div><div class="sk" style="height:12px;margin-top:12px"></div><div class="sk" style="height:12px;width:72%;margin-top:8px"></div></div></div>';let me;try{const r=await fetch('/api/me',{credentials:'same-origin',cache:'no-store'});if(r.status===401)return login();if(!r.ok)return login(tr('Could not verify this sign-in. Please sign in again.','ورود تأیید نشد. دوباره وارد شو.'));me=await r.json()}catch(_){return login(tr('Server unreachable','سرور در دسترس نیست'))}S.role=me.role;S.uid=me.uid||0;S.owner=!!me.owner;S.perms=me.perms||null;S.hard=me.hard||{};S.ver=me.version||'';S.username=me.username||'';if(me.lang==='fa'||me.lang==='en'){LANG=me.lang;ls.set('pg_lang',LANG);applyLook()}if(me.must_change){requiredPasswordPage();return}buildShell();if(S.role==='admin')loadAdmin();route();if(!POLL)POLL=setInterval(tick,1000)}
function requiredPasswordPage(){applyLook();$('#root').innerHTML='<div class="login"><section class="login-shell"><div class="login-form"><div class="login-brand"><span class="lg">'+ic('logo')+'</span><span>PR GRAM <small>'+tr('ACCOUNT PORTAL','درگاه حساب کاربری')+'</small></span></div><div class="login-copy"><p class="login-kicker">'+tr('ONE LAST STEP','یک مرحلهٔ دیگر')+'</p><h1>'+tr('Choose a new password','یک رمز تازه انتخاب کن')+'</h1><p>'+tr('Your temporary password was accepted. Set a private password to continue.','رمز موقت تأیید شد. برای ادامه یک رمز خصوصی انتخاب کن.')+'</p></div><form id="requiredPasswordForm" class="login-fields"><label>'+tr('New password','رمز تازه')+'<span class="password-input"><input class="inp" id="newPassword" type="password" autocomplete="new-password" minlength="10" required><button type="button" class="password-toggle" data-password-toggle="newPassword" aria-label="'+tr('Show password','نمایش رمز')+'">'+ic('eye')+'</button></span></label><div class="password-strength" aria-live="polite"><span class="password-strength-track"><i id="passwordStrengthFill"></i></span><small id="passwordStrengthLabel"></small></div><p class="password-hint">'+tr('Use at least 10 characters. A longer phrase is easier to remember.','حداقل ۱۰ نویسه بگذار؛ عبارت طولانی‌تر راحت‌تر به خاطر می‌ماند.')+'</p><label>'+tr('Confirm password','تکرار رمز')+'<span class="password-input"><input class="inp" id="confirmPassword" type="password" autocomplete="new-password" minlength="10" required><button type="button" class="password-toggle" data-password-toggle="confirmPassword" aria-label="'+tr('Show password','نمایش رمز')+'">'+ic('eye')+'</button></span></label><small class="password-match" id="passwordMatch" aria-live="polite"></small><p class="login-error" id="passwordError" role="alert" aria-live="polite"></p><button class="btn pri login-submit" id="savePassword" type="submit">'+tr('Save password and continue','ذخیرهٔ رمز و ادامه')+'</button></form></div><aside class="login-art" aria-hidden="true"><div class="art-orbit orbit-a"></div><div class="art-orbit orbit-b"></div><div class="art-coin"><span>₲</span><i></i></div><div class="art-caption"><b>'+tr('Private access for each account','دسترسی خصوصی برای هر حساب')+'</b><small>'+tr('Only you can use this sign-in','فقط خودت می‌توانی از این ورود استفاده کنی')+'</small></div></aside></section></div>';bindPasswordControls($('#root'));$('#requiredPasswordForm').addEventListener('submit',async e=>{e.preventDefault();await savePasswordForm(true)})}

async function savePasswordForm(force){const current=$('#currentPassword')?$('#currentPassword').value:'',password=$('#newPassword').value||'',confirm=$('#confirmPassword').value||'',err=$('#passwordError'),btn=$('#savePassword');if(password.length<10){err.textContent=tr('Use at least 10 characters.','حداقل ۱۰ نویسه وارد کن.');return}if(password!==confirm){err.textContent=tr('The passwords do not match.','رمزها با هم یکسان نیستند.');return}btn.disabled=true;err.textContent='';btn.classList.add('busy');try{const r=await fetch('/api/password',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({currentPassword:current,newPassword:password})});const j=await r.json().catch(()=>({}));if(!r.ok||!j.ok){err.textContent=j.error==='secure connection required'?tr('Use HTTPS or ask the owner to enable HTTP sign-in.','از HTTPS استفاده کن یا از مالک بخواه ورود HTTP را فعال کند.'):tr(j.error||'Could not change the password.','تغییر رمز انجام نشد.');btn.disabled=false;btn.classList.remove('busy');return}if(force){await boot();return}const m=$('#layer').lastElementChild;if(m)m.dispatchEvent(new MouseEvent('mousedown',{bubbles:true}));toast(tr('Password changed','رمز عبور تغییر کرد'))}catch(_){err.textContent=tr('The server could not be reached. Try again.','ارتباط با سرور برقرار نشد. دوباره تلاش کن.');btn.disabled=false;btn.classList.remove('busy')}}

function changePassword(force){if(force){requiredPasswordPage();return}const box=modal('<form id="passwordChangeForm" class="password-modal"><div class="password-modal-head"><span class="credential-mark">'+ic('key')+'</span><div><h2>'+tr('Change password','تغییر رمز عبور')+'</h2><p>'+tr('Changing it signs out your other web sessions.','با تغییر رمز، نشست‌های دیگر پنل خارج می‌شوند.')+'</p></div></div><label>'+tr('Current password','رمز فعلی')+'<span class="password-input"><input class="inp" id="currentPassword" type="password" autocomplete="current-password" required><button type="button" class="password-toggle" data-password-toggle="currentPassword" aria-label="'+tr('Show password','نمایش رمز')+'">'+ic('eye')+'</button></span></label><label>'+tr('New password','رمز تازه')+'<span class="password-input"><input class="inp" id="newPassword" type="password" autocomplete="new-password" minlength="10" required><button type="button" class="password-toggle" data-password-toggle="newPassword" aria-label="'+tr('Show password','نمایش رمز')+'">'+ic('eye')+'</button></span></label><div class="password-strength" aria-live="polite"><span class="password-strength-track"><i id="passwordStrengthFill"></i></span><small id="passwordStrengthLabel"></small></div><p class="password-hint">'+tr('Use at least 10 characters.','حداقل ۱۰ نویسه انتخاب کن.')+'</p><label>'+tr('Confirm new password','تکرار رمز تازه')+'<span class="password-input"><input class="inp" id="confirmPassword" type="password" autocomplete="new-password" minlength="10" required><button type="button" class="password-toggle" data-password-toggle="confirmPassword" aria-label="'+tr('Show password','نمایش رمز')+'">'+ic('eye')+'</button></span></label><small class="password-match" id="passwordMatch" aria-live="polite"></small><p class="login-error" id="passwordError" role="alert" aria-live="polite"></p><div class="row end password-actions"><button class="btn" id="cancelPassword" type="button">'+tr('Cancel','لغو')+'</button><button class="btn pri" id="savePassword" type="submit">'+tr('Save password','ذخیرهٔ رمز')+'</button></div></form>');bindPasswordControls(box.el);$('#cancelPassword',box.el).onclick=()=>box.close();$('#passwordChangeForm',box.el).addEventListener('submit',async e=>{e.preventDefault();await savePasswordForm(false)})}

function showCredentialCard(username,password,target){const m=modal('<div class="credential-card"><div class="credential-card-top"><span class="credential-mark">'+ic('key')+'</span><span class="credential-once">'+tr('ONE-TIME DETAILS','اطلاعات یک‌بارمصرف')+'</span></div><p class="login-kicker">'+tr('TEMPORARY SIGN-IN','ورود موقت')+'</p><h2>'+tr('Credentials are ready','اطلاعات ورود آماده است')+'</h2><p>'+tr('Send these details privately to the account owner. The password is replaced after they set a new one.','این اطلاعات را خصوصی به صاحب حساب بده. بعد از انتخاب رمز تازه، رمز موقت باطل می‌شود.')+'</p><div class="credential-target">'+tr('Account','حساب')+' <bdi>'+esc(target||'')+'</bdi></div><label>'+tr('Username','نام کاربری')+'<span class="credential-field"><input id="credUsername" readonly value="'+esc(username)+'"><button type="button" id="copyUsername" aria-label="'+tr('Copy username','کپی نام کاربری')+'">'+ic('copy')+'</button></span></label><label>'+tr('Temporary password','رمز موقت')+'<span class="credential-field credential-password"><input id="credPassword" type="text" readonly value="'+esc(password)+'" autocomplete="off"><button type="button" id="copyPassword" aria-label="'+tr('Copy temporary password','کپی رمز موقت')+'">'+ic('copy')+'</button></span></label><div class="credential-note">'+ic('info')+'<span>'+tr('This password is shown once here. The account must choose a new password at its next sign-in.','این رمز فقط همین‌جا یک‌بار نمایش داده می‌شود. حساب در ورود بعدی باید رمز تازه انتخاب کند.')+'</span></div><div class="row end credential-actions"><button class="btn" id="closeCredential" type="button">'+tr('Close','بستن')+'</button><button class="btn pri" id="doneCredential" type="button">'+tr('Done','تمام')+'</button></div></div>');const copy=async id=>{const input=$('#'+id,m.el);try{if(!navigator.clipboard)throw new Error('clipboard unavailable');await navigator.clipboard.writeText(input.value);toast(tr('Copied','کپی شد'))}catch(_){input.focus();input.select();toast(tr('Text selected; copy it manually','متن انتخاب شد؛ دستی کپی‌اش کن'),1)}};$('#copyUsername',m.el).onclick=()=>copy('credUsername');$('#copyPassword',m.el).onclick=()=>copy('credPassword');$('#closeCredential',m.el).onclick=()=>m.close();$('#doneCredential',m.el).onclick=()=>m.close()}


boot();
